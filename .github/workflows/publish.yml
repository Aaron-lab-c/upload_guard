name: Publish

# 觸發方式（三選一皆可）：
#   1. 推一個版本 tag：   git tag v0.1.0 && git push origin v0.1.0
#   2. 在 GitHub 發布 Release（會連帶建立 tag）
#   3. Actions 頁面手動「Run workflow」
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build twine
      - name: Tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$VERSION" || { echo "tag v$TAG != pyproject version $VERSION"; exit 1; }
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/python "$GITHUB_WORKSPACE/tools/readme_examples.py" --run
          /tmp/clean/bin/upload_guard --version
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi            # 與 PyPI Trusted Publisher 設定的 environment 名稱一致
    permissions:
      id-token: write            # trusted publishing（不需要 API token）
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
